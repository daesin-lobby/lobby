<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAESIN Lobby Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f17;
    --panel:#121826;
    --panel-2:#161e2f;
    --line:rgba(255,255,255,.07);
    --ink:#eef2f8;
    --ink-2:#a9b3c4;
    --ink-3:#5f6b80;
    --accent:#3d8bff;
    --gold:#d8b26a;
    --sun:#ff6b6b;
    --sat:#6aa8ff;
    --rain:#5fb4ff;
    --snow:#cfe3ff;
    --u: 10.8px; /* 실제 값은 스크립트가 화면 크기에 맞춰 설정 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{
    font-family:"Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 60% 50% at 0% 0%, rgba(61,139,255,.10), transparent 60%),
      radial-gradient(ellipse 50% 50% at 100% 100%, rgba(216,178,106,.06), transparent 60%),
      var(--bg);
  }
  body.idle{cursor:none}
  .stage{
    height:100vh;width:100vw;transition:transform 2s;
    padding:calc(var(--u)*3) calc(var(--u)*3.4);
    display:grid;
    grid-template-columns:1.45fr 1fr;
    grid-template-rows:auto 1fr;
    gap:calc(var(--u)*1.6);
  }

  header{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center}
  .logo{height:calc(var(--u)*3.2);width:auto;display:block}
  .brand .mark{margin-right:calc(var(--u)*1)}
  .mark{
    width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:calc(var(--u)*.7);
    background:linear-gradient(135deg,#2f6fe0,#5aa2ff);
    display:grid;place-items:center;
    font-family:Outfit,sans-serif;font-weight:600;font-size:calc(var(--u)*1.45);color:#fff;
  }
  .wordmark{font-family:Outfit,sans-serif;font-weight:600;font-size:calc(var(--u)*1.8);letter-spacing:.32em}
  .head-date{font-size:calc(var(--u)*1.7);color:var(--ink-2);font-weight:300}
  .head-date b{color:var(--ink);font-weight:500}

  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:calc(var(--u)*1.4);
    position:relative;overflow:hidden;
  }
  .label{font-family:Outfit,sans-serif;font-size:calc(var(--u)*.9);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3)}

  /* 시계 */
  .left,.right{display:grid;gap:calc(var(--u)*1.6);min-height:0}
  .left{grid-template-rows:auto 1fr}
  .right{grid-template-rows:1fr auto}
  .clock{padding:calc(var(--u)*1.5) calc(var(--u)*2.8) calc(var(--u)*1.6)}
  .time-row{display:flex;align-items:flex-end;margin-top:calc(var(--u)*.8)}
  .time-row .ampm,.time-row .hhmm{margin-right:calc(var(--u)*1.4)}
  .ampm{font-family:Outfit,sans-serif;font-size:calc(var(--u)*2.8);color:var(--accent);padding-bottom:calc(var(--u)*1.5);letter-spacing:.04em}
  .hhmm{font-family:Outfit,sans-serif;font-weight:200;font-size:calc(var(--u)*9.6);line-height:.86;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .hhmm .colon{opacity:.35}
  .ss{font-family:Outfit,sans-serif;font-weight:300;font-size:calc(var(--u)*2.8);color:var(--ink-3);padding-bottom:calc(var(--u)*1.4);font-variant-numeric:tabular-nums;width:2.2ch}
  .date-line{margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*1.7);color:var(--ink-2);font-weight:300}
  .date-line b{color:var(--ink);font-weight:500}

  /* 날짜 (시계 아래) */
  .clock{display:flex;align-items:center}
  .clock-main{flex:1;min-width:0}
  .clock-date{text-align:right;padding-left:calc(var(--u)*1.6);border-left:1px solid var(--line);margin-left:calc(var(--u)*1.6)}
  .clock-date .yr{font-family:Outfit,sans-serif;font-weight:300;font-size:calc(var(--u)*1.3);color:var(--ink-3);letter-spacing:.12em}
  .clock-date .md{font-size:calc(var(--u)*3.4);font-weight:700;letter-spacing:-.02em;margin-top:calc(var(--u)*.3);white-space:nowrap}
  .clock-date .dw{
    display:inline-block;margin-top:calc(var(--u)*.7);
    font-size:calc(var(--u)*2.2);font-weight:700;color:#fff;background:var(--accent);
    padding:.15em .7em;border-radius:.4em
  }
  .clock-date .dw.sun{background:#e05252} .clock-date .dw.sat{background:#3f7fe0}

  /* 웰컴보드 (슬라이드) */
  .welcome{padding:calc(var(--u)*2.4) calc(var(--u)*3.2);display:flex;flex-direction:column;min-height:0}
  .welcome::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse 70% 70% at 100% 0%, rgba(216,178,106,.13), transparent 60%);pointer-events:none}
  .welcome.vip{border-color:rgba(216,178,106,.38)}
  .welcome .label{color:var(--gold);display:flex;justify-content:space-between}
  .w-slide{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:opacity .6s;margin-top:calc(var(--u)*.6)}
  .w-slide > :first-child{margin-top:auto}
  .w-slide > :last-child{margin-bottom:auto}
  .w-slide.out{opacity:0}
  .w-title{font-weight:300;font-size:calc(var(--u)*2.1);color:var(--gold)}
  .w-company{font-size:calc(var(--u)*2.6);font-weight:500;margin-top:calc(var(--u)*1);word-break:keep-all}
  .w-guest{font-size:calc(var(--u)*var(--gs,5)*var(--ws,1));font-weight:700;line-height:1.2;margin-top:calc(var(--u)*.7);word-break:keep-all}
  .w-guest .g + .g{margin-top:.25em}
  .w-guest .g small{font-size:.62em;font-weight:500;color:var(--ink-2);margin-left:.3em}
  .w-guest.cols2{display:grid;grid-template-columns:1fr 1fr;grid-column-gap:calc(var(--u)*2.4);grid-row-gap:.25em;align-content:start}
  .w-guest.cols2 .g + .g{margin-top:0}
  .w-msg{font-size:calc(var(--u)*1.6);color:var(--ink-2);margin-top:calc(var(--u)*1.4);font-weight:300;line-height:1.6;word-break:keep-all;max-width:44ch}
  .w-default .w-guest{font-size:calc(var(--u)*3.8);font-weight:500}
  .w-default .w-title{font-family:Outfit,sans-serif;letter-spacing:.04em}
  .w-dots{display:flex}
  .w-dots i{width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:rgba(216,178,106,.25);margin-left:calc(var(--u)*.5)}
  .w-dots i.on{background:var(--gold)}

  /* 달력 */
  .calendar{padding:calc(var(--u)*1.8) calc(var(--u)*2.4);display:flex;flex-direction:column;min-height:0}
  .cal-head{display:flex;align-items:baseline;justify-content:space-between}
  .cal-month{font-family:Outfit,"Noto Sans KR",sans-serif;font-weight:300;font-size:calc(var(--u)*3)}
  .cal-month small{font-family:Outfit,sans-serif;font-size:.42em;color:var(--ink-3);margin-left:.5em;letter-spacing:.2em}
  .cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;margin-top:calc(var(--u)*1);gap:calc(var(--u)*.3)}
  .dow{font-size:calc(var(--u)*1.05);color:var(--ink-3);text-align:center;align-self:center;font-weight:500}
  .dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
  .day{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Outfit,sans-serif;font-size:calc(var(--u)*1.7);font-weight:300;border-radius:calc(var(--u)*.8);font-variant-numeric:tabular-nums}
  .day.sun,.day.hol{color:var(--sun)} .day.sat{color:var(--sat)}
  .day.other{opacity:.18}
  .day.past{opacity:.45}
  .day .hn{font-family:"Noto Sans KR";font-size:calc(var(--u)*.72);margin-top:.15em;opacity:.85;white-space:nowrap}
  .day.today{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 0 calc(var(--u)*2) rgba(61,139,255,.45);opacity:1}

  /* 날씨 (달력과 같은 폭) */
  .weather{padding:calc(var(--u)*1.6) calc(var(--u)*2.2) calc(var(--u)*1.7)}
  .wx-top{display:flex;align-items:center}
  .wx-now{display:flex;align-items:center;margin-right:calc(var(--u)*1.6)}
  .wx-now .wx-icon{margin-right:calc(var(--u)*1)}
  .wx-icon{width:calc(var(--u)*5);height:calc(var(--u)*5);flex:none}
  .wx-icon svg{width:100%;height:100%}
  .wx-temp{font-family:Outfit,sans-serif;font-weight:200;font-size:calc(var(--u)*5.4);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wx-temp sup{font-size:.4em;font-weight:300;vertical-align:top;position:relative;top:.25em;margin-left:.04em;color:var(--ink-2)}
  .wx-cond .loc{font-size:calc(var(--u)*.95);color:var(--ink-3);letter-spacing:.04em}
  .wx-cond .cond{font-size:calc(var(--u)*1.9);font-weight:500;margin-top:calc(var(--u)*.2);white-space:nowrap}
  .wx-cond .hilo{font-family:Outfit,"Noto Sans KR",sans-serif;font-size:calc(var(--u)*1.15);color:var(--ink-2);margin-top:calc(var(--u)*.3);white-space:nowrap}
  .wx-cond .hilo .hi{color:#ff9b8a} .wx-cond .hilo .lo{color:#8ec0ff}
  .wx-meta{margin-left:auto;display:flex;flex-direction:column}
  .wx-meta div + div{margin-top:calc(var(--u)*.3)}
  .wx-meta div{display:flex;align-items:baseline;white-space:nowrap}
  .wx-meta .k{font-size:calc(var(--u)*.95);color:var(--ink-3);width:2.8em;margin-right:calc(var(--u)*.4)}
  .wx-meta .v{font-family:Outfit,"Noto Sans KR",sans-serif;font-size:calc(var(--u)*1.3)}

  .wx-bottom{display:flex;align-items:stretch;margin-top:calc(var(--u)*1.4)}
  .wx-precip{
    flex:none;width:calc(var(--u)*14.5);margin-right:calc(var(--u)*1.2);
    padding:calc(var(--u)*.9) calc(var(--u)*1.2);border-radius:calc(var(--u)*1);
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;
  }
  .wx-precip .k{font-size:calc(var(--u)*.9);color:var(--ink-3)}
  .wx-precip .v{font-size:calc(var(--u)*1.6);font-weight:700;margin-top:calc(var(--u)*.2)}
  .wx-precip .d{font-size:calc(var(--u)*.95);color:var(--ink-2);margin-top:calc(var(--u)*.25);line-height:1.35}
  .wx-precip.rain{background:rgba(95,180,255,.10);border-color:rgba(95,180,255,.35)}
  .wx-precip.rain .v{color:var(--rain)}
  .wx-precip.snow{background:rgba(207,227,255,.10);border-color:rgba(207,227,255,.35)}
  .wx-precip.snow .v{color:var(--snow)}

  .wx-hours{flex:1;display:flex;justify-content:space-between}
  .hr{display:flex;flex-direction:column;align-items:center;flex:1}
  .hr .t{font-size:calc(var(--u)*.9);color:var(--ink-3)}
  .hr .i{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);margin:calc(var(--u)*.3) 0}
  .hr .i svg{width:100%;height:100%}
  .hr .c{font-family:Outfit,sans-serif;font-size:calc(var(--u)*1.25)}
  .hr .p{font-family:Outfit,sans-serif;font-size:calc(var(--u)*.85);color:var(--rain);margin-top:.1em;min-height:1.2em}
  .wx-foot{position:absolute;right:calc(var(--u)*1.4);top:calc(var(--u)*.8);font-size:calc(var(--u)*.8);color:var(--ink-3)}

  /* 컨트롤 */
  .ctrl{position:fixed;right:calc(var(--u)*1);bottom:calc(var(--u)*1);display:flex;opacity:.15;transition:opacity .3s;z-index:5}
  .ctrl:hover{opacity:1}
  body.idle .ctrl{opacity:0}
  .ctrl button + button{margin-left:6px}
  .ctrl button:focus{outline:3px solid var(--accent);opacity:1}
  .ctrl:focus-within{opacity:1}
  .ctrl button{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);border-radius:8px;font:500 12px "Noto Sans KR";padding:7px 10px;cursor:pointer}

</style>
</head>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var DOW = ["일","월","화","수","목","금","토"];
  var MONTH_EN = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

  /* 공휴일: MM-DD는 매년, YYYY-MM-DD는 해당 연도만 */
  var HOL_FIXED = {"01-01":"신정","03-01":"삼일절","05-05":"어린이날","06-06":"현충일","08-15":"광복절","10-03":"개천절","10-09":"한글날","12-25":"성탄절"};
  var HOL_YEAR = {
    "2026-02-16":"설날","2026-02-17":"설날","2026-02-18":"설날","2026-03-02":"대체공휴일",
    "2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거","2026-08-17":"대체공휴일",
    "2026-09-24":"추석","2026-09-25":"추석","2026-09-26":"추석","2026-10-05":"대체공휴일"
  };


  /* 표시 데이터: 같은 폴더의 board.json (편집 페이지에서 저장) */
  var state = {
    title: "방문을 진심으로 환영합니다",
    message: "귀한 걸음 해주셔서 감사합니다.",
    visits: [],
    loc: {name:"안산 성곡동", lat:37.3110, lon:126.7450}
  };

  function pad(n){ return (n<10?"0":"")+n; }
  function kst(d){ d = d || new Date(); return new Date(d.getTime() + (d.getTimezoneOffset()+540)*60000); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  // "2026-11-18T13:00" (한국시간) → ms
  function kstMs(v){
    if(!v) return NaN;
    var iso = /[zZ]|[+-]\d\d:?\d\d$/.test(v) ? v : (v.length===16 ? v+":00" : v)+"+09:00";
    return new Date(iso).getTime();
  }

  /* ---------- 화면 크기 단위 (오래된 TV 브라우저 대응) ---------- */
  function fitUnit(){
    var u = Math.min(window.innerWidth/100, window.innerHeight*1.78/100);
    document.documentElement.style.setProperty("--u", u.toFixed(2)+"px");
  }
  fitUnit(); window.addEventListener("resize", function(){ fitUnit(); setTimeout(fitWelcome, 50); });

  /* ---------- 시계 + 날짜 ---------- */
  var lastDateKey = "";
  function tick(){
    var n = kst();
    var h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
    $("ampm").textContent = h < 12 ? "AM" : "PM";
    $("hhmm").innerHTML = pad(h)+'<span class="colon">:</span>'+pad(m);
    $("ss").textContent = pad(s);
    var key = n.getFullYear()+"-"+n.getMonth()+"-"+n.getDate();
    if(key !== lastDateKey){
      lastDateKey = key;
      var dw = n.getDay();
      $("cMd").textContent = (n.getMonth()+1)+"월 "+n.getDate()+"일";
      $("cDw").textContent = DOW[dw]+"요일";
      $("cDw").className = "dw"+(dw===0?" sun":dw===6?" sat":"");
      $("cYr").textContent = n.getFullYear();
      renderCalendar(n);
    }
    if(s % 15 === 0) renderWelcome(false);
  }

  /* ---------- 달력 ---------- */
  function holidayOf(y,m,d){
    var md = pad(m+1)+"-"+pad(d);
    return HOL_YEAR[y+"-"+md] || HOL_FIXED[md] || "";
  }
  function renderCalendar(now){
    var y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
    $("calMonth").innerHTML = (m+1)+"월<small>"+MONTH_EN[m]+" "+y+"</small>";
    var g = $("calGrid"); g.innerHTML = "";
    DOW.forEach(function(d,i){
      var el = document.createElement("div");
      el.className = "dow"+(i===0?" sun":i===6?" sat":"");
      el.textContent = d; g.appendChild(el);
    });
    var first = new Date(y,m,1).getDay();
    var days = new Date(y,m+1,0).getDate();
    var prevDays = new Date(y,m,0).getDate();
    var cells = Math.ceil((first+days)/7)*7;
    for(var i=0;i<cells;i++){
      var el = document.createElement("div");
      var col = i%7, cls = "day";
      if(i<first){ el.textContent = prevDays-first+1+i; cls+=" other"; }
      else if(i>=first+days){ el.textContent = i-first-days+1; cls+=" other"; }
      else {
        var d = i-first+1, hn = holidayOf(y,m,d);
        if(hn) cls+=" hol";
        if(d===today) cls+=" today"; else if(d<today) cls+=" past";
        el.innerHTML = d + (hn?'<span class="hn">'+hn+'</span>':"");
      }
      if(col===0) cls+=" sun";
      if(col===6) cls+=" sat";
      el.className = cls;
      g.appendChild(el);
    }
  }

  /* ---------- 웰컴보드 슬라이드쇼 ---------- */
  var SLIDE_MS = 12000;
  var slideIdx = 0, slideKey = "";
  function activeVisits(){
    var now = Date.now();
    return (state.visits||[]).filter(function(v){
      if(!v || !v.guests || !v.guests.some(function(g){ return g && (g.name||"").trim(); })) return false;
      var st = kstMs(v.start), en = kstMs(v.end);
      if(!isNaN(st) && now < st) return false;
      if(!isNaN(en) && now > en) return false;
      return true;
    });
  }
  function honor(g){
    var name = (g.name||"").trim(), t = (g.title||"").trim();
    if(!t) return esc(name)+" 님";
    if(!/님$/.test(t)) t += "님";
    return esc(name)+"<small>"+esc(t)+"</small>";
  }
  function paintSlide(list){
    var box = $("welcome"), g = $("wGuest");
    g.style.setProperty("--ws", 1);
    if(!list.length){
      box.className = "card welcome w-default";
      $("wTitle").textContent = "Welcome to DAESIN";
      $("wCompany").textContent = "";
      g.className = "w-guest"; g.style.removeProperty("--gs");
      g.textContent = "대신을 찾아주셔서 감사합니다";
      $("wMsg").textContent = "오늘도 좋은 하루 보내세요.";
      $("wDots").innerHTML = "";
      return;
    }
    var v = list[slideIdx % list.length];
    var guests = v.guests.filter(function(x){ return x && (x.name||"").trim(); });
    box.className = "card welcome vip";
    $("wTitle").textContent = state.title || "방문을 진심으로 환영합니다";
    $("wCompany").textContent = v.company || "";
    var n = guests.length;
    g.className = "w-guest" + (n >= 2 ? " cols2" : "");
    g.style.setProperty("--gs", n<=1 ? 5 : n<=4 ? 3.8 : n<=6 ? 3.3 : 2.8);
    g.innerHTML = guests.map(function(x){ return '<div class="g">'+honor(x)+'</div>'; }).join("");
    $("wMsg").textContent = (v.message||"").trim() || state.message || "";
    var dots = "";
    if(list.length > 1) for(var i=0;i<list.length;i++) dots += '<i'+(i===slideIdx%list.length?' class="on"':'')+'></i>';
    $("wDots").innerHTML = dots;
    fitWelcome();
  }
  // 방문 일정이 바뀌었을 때만 다시 그림 (advance=true면 다음 슬라이드로)
  function renderWelcome(advance){
    var list = activeVisits();
    var key = JSON.stringify(list)+"|"+state.title+"|"+state.message;
    if(!advance && key === slideKey) return;
    if(key !== slideKey){ slideIdx = 0; slideKey = key; paintSlide(list); return; }
    if(list.length < 2) return;
    var el = $("wSlide");
    el.classList.add("out");
    setTimeout(function(){ slideIdx = (slideIdx+1) % list.length; paintSlide(list); el.classList.remove("out"); }, 600);
  }
  setInterval(function(){ renderWelcome(true); }, SLIDE_MS);

  // 칸을 넘치면 이름 글자만 단계적으로 줄임
  function fitWelcome(){
    var box = $("wSlide"), g = $("wGuest"), ws = 1;
    g.style.setProperty("--ws", 1);
    while((box.scrollHeight > box.clientHeight + 1 || g.scrollWidth > g.clientWidth + 1) && ws > 0.4){
      ws = Math.round((ws - 0.05)*100)/100;
      g.style.setProperty("--ws", ws);
    }
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitWelcome(); });

  /* ---------- 날씨 (Open-Meteo, 키 불필요) ---------- */
  var ICON = {
    sun:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="#ffc94d"/><g stroke="#ffc94d" stroke-width="3.5" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g></svg>',
    moon:'<svg viewBox="0 0 64 64"><path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="#e6ecff"/></svg>',
    partly:'<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#ffc94d"/><g stroke="#ffc94d" stroke-width="3" stroke-linecap="round"><path d="M24 4v5M4 24h5M9.9 9.9l3.5 3.5M38.1 9.9l-3.5 3.5"/></g><path d="M22 52h28a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 22 52z" fill="#dfe6f2"/></svg>',
    partlyNight:'<svg viewBox="0 0 64 64"><path d="M30 6a14 14 0 1 0 10 22A11 11 0 0 1 30 6z" fill="#e6ecff"/><path d="M22 54h28a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 22 54z" fill="#b8c3d6"/></svg>',
    cloud:'<svg viewBox="0 0 64 64"><path d="M18 50h30a12 12 0 0 0 0-24 16 16 0 0 0-30.4 4.6A10 10 0 0 0 18 50z" fill="#b8c3d6"/></svg>',
    fog:'<svg viewBox="0 0 64 64"><path d="M18 36h30a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 18 36z" fill="#9aa6ba"/><g stroke="#9aa6ba" stroke-width="3.5" stroke-linecap="round"><path d="M12 44h40M18 52h30"/></g></svg>',
    rain:'<svg viewBox="0 0 64 64"><path d="M18 38h30a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 18 38z" fill="#b8c3d6"/><g stroke="#5fb4ff" stroke-width="3.5" stroke-linecap="round"><path d="M22 44l-3 8M33 44l-3 8M44 44l-3 8"/></g></svg>',
    snow:'<svg viewBox="0 0 64 64"><path d="M18 38h30a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 18 38z" fill="#c9d3e3"/><g fill="#eaf3ff"><circle cx="21" cy="47" r="3"/><circle cx="32" cy="53" r="3"/><circle cx="43" cy="47" r="3"/><circle cx="27" cy="58" r="2.4"/><circle cx="39" cy="59" r="2.4"/></g></svg>',
    sleet:'<svg viewBox="0 0 64 64"><path d="M18 38h30a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 18 38z" fill="#c0cad9"/><path d="M23 44l-3 8M41 44l-3 8" stroke="#5fb4ff" stroke-width="3.5" stroke-linecap="round"/><circle cx="31" cy="50" r="3" fill="#eaf3ff"/></svg>',
    storm:'<svg viewBox="0 0 64 64"><path d="M18 38h30a10 10 0 0 0 0-20 14 14 0 0 0-26.6 4A8 8 0 0 0 18 38z" fill="#8f9bb0"/><path d="M34 40l-8 12h7l-4 10 11-14h-7l4-8z" fill="#ffd257"/></svg>'
  };
  // WMO 날씨 코드 → [설명, 아이콘, 종류]
  function wmo(code, isDay){
    var c = Number(code);
    if(c===0) return ["맑음", isDay?"sun":"moon", ""];
    if(c===1) return ["대체로 맑음", isDay?"partly":"partlyNight", ""];
    if(c===2) return ["구름 조금", isDay?"partly":"partlyNight", ""];
    if(c===3) return ["흐림","cloud",""];
    if(c===45||c===48) return ["안개","fog",""];
    if(c===51||c===53||c===55) return ["이슬비","rain","rain"];
    if(c===56||c===57) return ["어는 이슬비","sleet","rain"];
    if(c===61) return ["약한 비","rain","rain"];
    if(c===63) return ["비","rain","rain"];
    if(c===65) return ["강한 비","rain","rain"];
    if(c===66||c===67) return ["어는 비","sleet","rain"];
    if(c===71) return ["약한 눈","snow","snow"];
    if(c===73) return ["눈","snow","snow"];
    if(c===75) return ["많은 눈","snow","snow"];
    if(c===77) return ["싸락눈","snow","snow"];
    if(c===80) return ["약한 소나기","rain","rain"];
    if(c===81) return ["소나기","rain","rain"];
    if(c===82) return ["강한 소나기","rain","rain"];
    if(c===85||c===86) return ["소낙눈","snow","snow"];
    if(c===95) return ["뇌우","storm","rain"];
    if(c===96||c===99) return ["뇌우·우박","storm","rain"];
    return ["-","cloud",""];
  }
  function windText(ms){
    if(ms < 1) return "고요";
    return Math.round(ms*10)/10+" m/s";
  }
  function hourLabel(h){ return (h<12?"AM ":"PM ")+pad(h)+"시"; }

  var lastWx = null;
  function renderWeather(d){
    var cur = d.current, daily = d.daily, hourly = d.hourly;
    var info = wmo(cur.weather_code, cur.is_day);
    $("wxIcon").innerHTML = ICON[info[1]];
    $("wxTemp").innerHTML = Math.round(cur.temperature_2m)+"<sup>°C</sup>";
    $("wxCond").textContent = info[0];
    $("wxHiLo").innerHTML = '최고 <span class="hi">'+Math.round(daily.temperature_2m_max[0])+'°</span> &nbsp;/&nbsp; 최저 <span class="lo">'+Math.round(daily.temperature_2m_min[0])+'°</span>';
    $("wxFeel").textContent = Math.round(cur.apparent_temperature)+"°";
    $("wxHum").textContent = Math.round(cur.relative_humidity_2m)+"%";
    $("wxWind").textContent = windText(cur.wind_speed_10m);

    // 강수·강설 상태
    var box = $("wxPrecip"), v, desc = "";
    var snowCm = Number(cur.snowfall)||0, precMm = Number(cur.precipitation)||0;
    var nowIso = cur.time; // "YYYY-MM-DDTHH:MM" (KST)
    var startIdx = 0;
    for(var i=0;i<hourly.time.length;i++){ if(hourly.time[i] > nowIso){ startIdx = i; break; } }
    if(snowCm > 0 || info[2]==="snow"){
      box.className = "wx-precip snow";
      v = "눈 내리는 중";
      desc = snowCm>0 ? "시간당 적설 "+(Math.round(snowCm*10)/10)+" cm" : info[0];
    } else if(precMm > 0 || info[2]==="rain"){
      box.className = "wx-precip rain";
      v = "비 내리는 중";
      desc = precMm>0 ? "시간당 강수 "+(Math.round(precMm*10)/10)+" mm" : info[0];
    } else {
      box.className = "wx-precip";
      v = "강수 없음";
      // 앞으로 12시간 안에 비/눈 예보가 있는지
      for(var j=startIdx;j<Math.min(startIdx+12,hourly.time.length);j++){
        var hi = wmo(hourly.weather_code[j], 1);
        if(hi[2] && (hourly.precipitation_probability[j]||0) >= 40){
          var hh = parseInt(hourly.time[j].slice(11,13),10);
          desc = hourLabel(hh)+"경 "+(hi[2]==="snow"?"눈":"비")+" 예보 ("+hourly.precipitation_probability[j]+"%)";
          break;
        }
      }
      if(!desc) desc = "오늘 강수확률 "+(daily.precipitation_probability_max[0]||0)+"%";
    }
    $("wxPv").textContent = v;
    $("wxPd").textContent = desc;

    // 시간별 6칸
    var wrap = $("wxHours"); wrap.innerHTML = "";
    for(var k=startIdx;k<Math.min(startIdx+6,hourly.time.length);k++){
      var hh2 = parseInt(hourly.time[k].slice(11,13),10);
      var isDay = hourly.is_day ? hourly.is_day[k] : (hh2>=7&&hh2<18?1:0);
      var w2 = wmo(hourly.weather_code[k], isDay);
      var p = hourly.precipitation_probability[k]||0;
      var el = document.createElement("div");
      el.className = "hr";
      el.innerHTML = '<div class="t">'+pad(hh2)+'시</div><div class="i">'+ICON[w2[1]]+'</div><div class="c">'+Math.round(hourly.temperature_2m[k])+'°</div><div class="p">'+(p>=20?p+"%":"")+'</div>';
      wrap.appendChild(el);
    }
    var t = kst();
    $("wxLoc").textContent = state.loc.name+" · "+pad(t.getHours())+":"+pad(t.getMinutes())+" 기준";
  }
  function fetchWeather(){
    var L = state.loc;
    var url = "https://api.open-meteo.com/v1/forecast?latitude="+L.lat+"&longitude="+L.lon+
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,rain,showers,snowfall,weather_code,wind_speed_10m,is_day"+
      "&hourly=temperature_2m,precipitation_probability,weather_code,is_day"+
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
      "&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=2";
    fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ lastWx = d; renderWeather(d); })
      .catch(function(){
        if(!lastWx){ $("wxCond").textContent = "날씨 정보 연결 중…"; $("wxLoc").textContent = state.loc.name; }
        if(lastWx) $("wxLoc").textContent = state.loc.name+" · 연결 재시도 중";
        setTimeout(fetchWeather, 60*1000);
      });
  }


  /* ---------- board.json 불러오기 (1분마다) ---------- */
  var boardSig = "";
  function pollBoard(){
    if(location.protocol === "file:") return;
    fetch("board.json?t="+Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){
        var sig = JSON.stringify(j);
        if(sig === boardSig) return;
        boardSig = sig;
        var oldLoc = JSON.stringify(state.loc);
        if(typeof j.title === "string") state.title = j.title;
        if(typeof j.message === "string") state.message = j.message;
        state.visits = Array.isArray(j.visits) ? j.visits : [];
        if(j.loc && isFinite(j.loc.lat) && isFinite(j.loc.lon)) state.loc = {name:j.loc.name||"", lat:+j.loc.lat, lon:+j.loc.lon};
        renderWelcome(false);
        if(JSON.stringify(state.loc) !== oldLoc) fetchWeather();
      }).catch(function(){});
  }

  /* ---------- 전체화면 / 커서 숨김 ---------- */
  $("fsBtn").addEventListener("click", function(){
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else { var p = document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
  });
  var idleT;
  function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add("idle"); }, 4000); }
  ["mousemove","mousedown","touchstart","keydown"].forEach(function(ev){ document.addEventListener(ev, wake, {passive:true}); });
  wake();

  /* ---------- 화면 잔상(번인) 방지 ---------- */
  setInterval(function(){
    var x = Math.round(Math.random()*8-4), y = Math.round(Math.random()*8-4);
    document.querySelector(".stage").style.transform = "translate("+x+"px,"+y+"px)";
  }, 5*60*1000);

  /* ---------- 시작 ---------- */
  tick(); setInterval(tick, 1000);
  renderWelcome(false);
  fetchWeather(); setInterval(fetchWeather, 10*60*1000);
  pollBoard(); setInterval(pollBoard, 60*1000);
  var bootAt = Date.now();
  setInterval(function(){ var n = kst(); if(n.getHours()===4 && n.getMinutes()===0 && Date.now()-bootAt > 120000) location.reload(); }, 15000);
})();
</script>
</body>
